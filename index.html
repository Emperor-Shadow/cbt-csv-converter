<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT Question CSV Converter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --accent: #00d084;
    --accent-dim: #00d08422;
    --text: #e6edf3;
    --muted: #8b949e;
    --error: #f85149;
    --error-dim: #f8514922;
    --success: #00d084;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }

  .badge {
    display: inline-block;
    background: var(--accent-dim);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--accent);
    margin-bottom: 12px;
  }

  h1 {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    font-weight: 300;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .card-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .card-label::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }

  textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    line-height: 1.6;
    padding: 14px;
    resize: vertical;
    min-height: 200px;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .btn {
    width: 100%;
    padding: 16px;
    border-radius: 10px;
    border: none;
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .btn-primary {
    background: var(--accent);
    color: #0d1117;
    margin-bottom: 10px;
  }

  .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }

  .btn-secondary:hover { background: var(--accent-dim); }
  .btn-secondary:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none;
  }

  .alert {
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
    line-height: 1.5;
  }

  .alert-error {
    background: var(--error-dim);
    border: 1px solid var(--error);
    color: var(--error);
  }

  .alert-success {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--accent);
  }

  .preview-table-wrap {
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-top: 8px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    font-family: 'Space Mono', monospace;
    min-width: 600px;
  }

  th {
    background: #1f2937;
    color: var(--accent);
    padding: 10px 12px;
    text-align: left;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  td {
    padding: 9px 12px;
    border-top: 1px solid var(--border);
    color: var(--text);
    vertical-align: top;
  }

  tr:nth-child(even) td { background: #ffffff06; }

  td.correct {
    color: var(--accent);
    font-weight: 700;
    text-align: center;
  }

  .stats {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 8px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--accent);
  }

  .stat span { font-size: 18px; font-weight: 700; display: block; }

  .hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="badge">CBT TOOL</div>
  <h1>Question <span>CSV</span> Converter</h1>
  <p class="subtitle">Paste AI-generated questions → Download ready-to-upload CSV</p>
</div>

<div class="alert alert-error" id="errorAlert"></div>
<div class="alert alert-success" id="successAlert"></div>

<div class="card">
  <div class="card-label">Paste AI Output Here</div>
  <textarea id="inputText" placeholder="Question,Option A,Option B,Option C,Option D,Correct Answer
What is Good morning in French?,Bonjour,Bonsoir,Bonne nuit,Salut,A
Which of these means Monday in French?,Mardi,Jeudi,Samedi,Lundi,D
..."></textarea>
</div>

<button class="btn btn-primary" onclick="processCSV()">⚡ Convert & Preview</button>
<button class="btn btn-secondary" id="downloadBtn" onclick="downloadCSV()" disabled>↓ Download CSV File</button>

<div class="card hidden" id="previewCard">
  <div class="card-label">Preview</div>
  <div class="stats" id="statsRow"></div>
  <div class="preview-table-wrap">
    <table id="previewTable"></table>
  </div>
</div>

<script>
  let cleanedCSV = '';

  function showError(msg) {
    const el = document.getElementById('errorAlert');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('successAlert').style.display = 'none';
  }

  function showSuccess(msg) {
    const el = document.getElementById('successAlert');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('errorAlert').style.display = 'none';
  }

  function parseCSVLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        inQuotes = !inQuotes;
      } else if (ch === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += ch;
      }
    }
    result.push(current.trim());
    return result;
  }

  function processCSV() {
    const raw = document.getElementById('inputText').value.trim();
    if (!raw) { showError('Please paste your AI-generated CSV text first.'); return; }

    const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    if (lines.length < 2) { showError('Not enough data. Make sure you pasted the full CSV including the header row.'); return; }

    // Find header row
    let headerIndex = -1;
    for (let i = 0; i < lines.length; i++) {
      const lower = lines[i].toLowerCase();
      if (lower.includes('question') && lower.includes('option') && lower.includes('correct')) {
        headerIndex = i;
        break;
      }
    }

    if (headerIndex === -1) { showError('Could not find the header row. Make sure the first row contains: Question, Option A, Option B, Option C, Option D, Correct Answer'); return; }

    const expectedHeaders = ['Question', 'Option A', 'Option B', 'Option C', 'Option D', 'Correct Answer'];
    const rows = [expectedHeaders];
    const errors = [];

    for (let i = headerIndex + 1; i < lines.length; i++) {
      const line = lines[i];
      if (line.startsWith('#') || line === '') continue;

      const cols = parseCSVLine(line);
      if (cols.length < 6) {
        errors.push(`Row ${i + 1} skipped — only ${cols.length} columns found (need 6)`);
        continue;
      }

      const question = cols[0];
      const optA = cols[1];
      const optB = cols[2];
      const optC = cols[3];
      const optD = cols[4];
      const correct = cols[5].toUpperCase().replace(/[^ABCD]/g, '');

      if (!question) { errors.push(`Row ${i + 1} skipped — question is empty`); continue; }
      if (!['A','B','C','D'].includes(correct)) {
        errors.push(`Row ${i + 1} skipped — Correct Answer "${cols[5]}" is not A, B, C, or D`);
        continue;
      }

      rows.push([question, optA, optB, optC, optD, correct]);
    }

    if (rows.length < 2) { showError('No valid questions found. Please check the format of your pasted text.'); return; }

    // Build clean CSV
    cleanedCSV = rows.map(row =>
      row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')
    ).join('\n');

    // Build preview table
    const table = document.getElementById('previewTable');
    table.innerHTML = '';
    const thead = document.createElement('thead');
    const hrow = document.createElement('tr');
    expectedHeaders.forEach(h => {
      const th = document.createElement('th');
      th.textContent = h;
      hrow.appendChild(th);
    });
    thead.appendChild(hrow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    for (let i = 1; i < rows.length; i++) {
      const tr = document.createElement('tr');
      rows[i].forEach((cell, j) => {
        const td = document.createElement('td');
        td.textContent = cell;
        if (j === 5) td.className = 'correct';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);

    // Stats
    const statsEl = document.getElementById('statsRow');
    statsEl.innerHTML = `
      <div class="stat"><span>${rows.length - 1}</span>Questions</div>
      <div class="stat"><span>${errors.length}</span>Skipped</div>
    `;

    document.getElementById('previewCard').classList.remove('hidden');
    document.getElementById('downloadBtn').disabled = false;

    if (errors.length > 0) {
      showError('Done with warnings:\n' + errors.join('\n'));
    } else {
      showSuccess(`✓ ${rows.length - 1} questions processed successfully. Check the preview below then download.`);
    }
  }

  function downloadCSV() {
    if (!cleanedCSV) return;
    const blob = new Blob([cleanedCSV], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'questions.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showSuccess('✓ CSV downloaded! You can now upload it to your question bank.');
  }
</script>
</body>
</html>
